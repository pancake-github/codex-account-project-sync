name: Windows tests and executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and isolated build dependency
        run: python -m pip install . pyinstaller==6.22.3
      - name: Synthetic regression tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Public tree and history audit
        run: python scripts/audit_public_tree.py
      - name: Build executable and distribution files
        run: python scripts/build_windows.py
      - name: Executable GUI startup check without user data
        shell: pwsh
        run: |
          $probe = Start-Process -FilePath '.\dist\CodexAccountProjectSync.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $probe.WaitForExit(30000)) { throw 'Executable startup check timed out.' }
          if ($probe.ExitCode -ne 0) { throw "Executable startup check failed: $($probe.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/CodexAccountProjectSync.exe
            dist/*-windows-x64.zip
            dist/*-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
