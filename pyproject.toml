[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-account-project-sync"
version = "0.1.0b1"
description = "Windows Codex local project grouping backup and sync across saved accounts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "pancake-github"}]
classifiers = ["Development Status :: 4 - Beta", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]
dependencies = []

[project.gui-scripts]
codex-account-project-sync = "codex_project_sync.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
